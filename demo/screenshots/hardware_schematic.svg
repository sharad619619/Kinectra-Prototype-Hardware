<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#090d16; font-family:'JetBrains Mono', monospace;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="40" y="45" font-size="20" font-weight="bold" fill="#ffffff" font-family="'Inter', sans-serif">Kinectra Prototype Hardware — Electrical Schematic</text>
  <text x="40" y="70" font-size="12" fill="#64748b">Revision: 1.2 • Sensor Fusion &amp; Haptic Edge Driver • Author: Sharad Singh</text>

  <!-- ESP32 Box -->
  <rect x="360" y="110" width="280" height="380" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="140" font-size="15" font-weight="bold" fill="#38bdf8">ESP32-WROOM-32D</text>
  <text x="450" y="160" font-size="11" fill="#64748b">Dual-Core 240MHz</text>

  <!-- ESP32 Pins Left -->
  <text x="375" y="210" font-size="12" fill="#cbd5e1">3V3</text>
  <text x="375" y="260" font-size="12" fill="#cbd5e1">GND</text>
  <text x="375" y="310" font-size="12" fill="#cbd5e1">GPIO 21 (SDA)</text>
  <text x="375" y="360" font-size="12" fill="#cbd5e1">GPIO 22 (SCL)</text>
  <text x="375" y="410" font-size="12" fill="#cbd5e1">GPIO 19 (INT)</text>

  <!-- ESP32 Pins Right -->
  <text x="510" y="210" font-size="12" fill="#cbd5e1">GPIO 18 (PWM)</text>
  <text x="510" y="260" font-size="12" fill="#cbd5e1">GPIO 2 (LED1)</text>
  <text x="510" y="310" font-size="12" fill="#cbd5e1">GPIO 4 (LED2)</text>
  <text x="510" y="360" font-size="12" fill="#cbd5e1">GPIO 34 (ADC)</text>

  <!-- MPU6050 Box (Left) -->
  <rect x="60" y="220" width="180" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="95" y="250" font-size="14" font-weight="bold" fill="#ffffff">MPU-6050 IMU</text>
  <text x="110" y="270" font-size="10" fill="#94a3b8">200Hz 6-DOF DMP</text>

  <text x="175" y="305" font-size="11" fill="#cbd5e1">VCC</text>
  <text x="175" y="340" font-size="11" fill="#cbd5e1">GND</text>
  <text x="175" y="375" font-size="11" fill="#cbd5e1">SDA</text>
  <text x="175" y="410" font-size="11" fill="#cbd5e1">SCL</text>
  <text x="175" y="435" font-size="11" fill="#cbd5e1">INT</text>

  <!-- Left Interconnect Lines -->
  <!-- 3.3V Line -->
  <path d="M 210 300 L 290 300 L 290 205 L 360 205" fill="none" stroke="#ef4444" stroke-width="2"/>
  <!-- GND Line -->
  <path d="M 210 335 L 305 335 L 305 255 L 360 255" fill="none" stroke="#64748b" stroke-width="2"/>
  <!-- SDA Line -->
  <path d="M 210 370 L 360 305" fill="none" stroke="#10b981" stroke-width="2"/>
  <!-- SCL Line -->
  <path d="M 210 405 L 360 355" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <!-- INT Line -->
  <path d="M 210 430 L 360 405" fill="none" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Haptic Driver Circuit (Right) -->
  <rect x="730" y="150" width="220" height="230" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="760" y="180" font-size="14" font-weight="bold" fill="#f97316">Haptic Actuator</text>
  <text x="770" y="200" font-size="10" fill="#94a3b8">ERM Coin Motor</text>

  <!-- Motor Symbol -->
  <circle cx="840" cy="245" r="24" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
  <text x="832" y="252" font-size="16" font-weight="bold" fill="#38bdf8">M</text>

  <!-- Flyback Diode -->
  <rect x="880" y="235" width="20" height="30" fill="#090d16" stroke="#f43f5e" stroke-width="1"/>
  <text x="884" y="254" font-size="9" fill="#f43f5e">1N</text>

  <!-- MOSFET -->
  <rect x="815" y="315" width="50" height="40" fill="#090d16" stroke="#38bdf8" stroke-width="1"/>
  <text x="822" y="340" font-size="10" fill="#38bdf8">2N7002</text>

  <!-- Right Interconnect Line (GPIO 18 to Gate) -->
  <path d="M 640 205 L 700 205 L 700 335 L 815 335" fill="none" stroke="#f97316" stroke-width="2"/>
  <text x="655" y="195" font-size="10" fill="#f97316">PWM 3.3V</text>

  <!-- Power Management Box (Bottom) -->
  <rect x="360" y="515" width="280" height="65" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="380" y="540" font-size="12" font-weight="bold" fill="#ffffff">TP4056 + 3.7V 1200mAh LiPo</text>
  <text x="380" y="560" font-size="10" fill="#10b981">AMS1117-3.3V LDO Regulator &amp; Low-Noise Star GND</text>
</svg>

  <rect x="580" y="210" width="185" height="26" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <circle cx="595" cy="223" r="4" fill="#22c55e"/>
  <text x="608" y="227" font-size="11" font-family="monospace" font-weight="700" fill="#22c55e">BOWLING RELEASE APEX</text>

  <rect x="30" y="605" width="750" height="35" fill="#0f172a" fill-opacity="0.95"/>
  <text x="45" y="627" font-size="11" font-family="monospace" font-weight="700" fill="#f97316">KINECTRA LABS</text>
  <text x="160" y="627" font-size="11" font-family="monospace" fill="#cbd5e1">• Fused Optical + IMU Telemetry | Wrist Whip: 2.15 m/s | Impact: 7.8g</text>

  <!-- Right Column: Hardware Node Card -->
  <rect x="805" y="195" width="365" height="235" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="825" y="225" font-size="14" font-weight="700" fill="#ffffff">ESP32 WEARABLE NODE</text>
  <text x="825" y="242" font-size="10" font-family="monospace" fill="#64748b">ID: kinectra-node-alpha (200Hz DMP)</text>
  <circle cx="1145" cy="225" r="5" fill="#10b981"/>

  <!-- IMU 4-Grid Box -->
  <rect x="825" y="260" width="75" height="60" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <text x="845" y="280" font-size="9" fill="#64748b" font-family="monospace">ROLL</text>
  <text x="838" y="305" font-size="15" font-family="monospace" font-weight="700" fill="#38bdf8">3.5°</text>

  <rect x="910" y="260" width="75" height="60" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <text x="928" y="280" font-size="9" fill="#64748b" font-family="monospace">PITCH</text>
  <text x="920" y="305" font-size="15" font-family="monospace" font-weight="700" fill="#38bdf8">-6.2°</text>

  <rect x="995" y="260" width="75" height="60" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <text x="1018" y="280" font-size="9" fill="#64748b" font-family="monospace">YAW</text>
  <text x="1005" y="305" font-size="15" font-family="monospace" font-weight="700" fill="#38bdf8">14.8°</text>

  <rect x="1080" y="260" width="75" height="60" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <text x="1095" y="280" font-size="9" fill="#64748b" font-family="monospace">TOTAL G</text>
  <text x="1092" y="305" font-size="15" font-family="monospace" font-weight="700" fill="#f43f5e">7.80g</text>

  <rect x="825" y="335" width="330" height="30" rx="6" fill="#4c0519" stroke="#e11d48" stroke-width="1"/>
  <text x="840" y="354" font-size="11" font-weight="600" fill="#fda4af">⚡ Impact Shock Spike: Bat Impact Confirmed</text>

  <text x="825" y="390" font-size="11" fill="#94a3b8">Battery: <tspan fill="#10b981" font-weight="700">94%</tspan> | WiFi RSSI: <tspan fill="#38bdf8">-54 dBm</tspan> | Packets: <tspan fill="#ffffff">48,210</tspan></text>
  <text x="825" y="410" font-size="11" fill="#94a3b8">Haptic Feedback Driver: <tspan fill="#10b981">ARMED &amp; SYNCHRONIZED</tspan></text>

  <!-- Right Column Lower: AI Coach Bubble -->
  <rect x="805" y="450" width="365" height="190" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="825" y="480" font-size="13" font-weight="700" fill="#f97316">COACH ARYAN (AI MULTIMODAL)</text>
  <rect x="825" y="495" width="330" height="125" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <text x="840" y="525" font-size="12" fill="#cbd5e1" font-style="italic">"Outstanding kinetic energy transfer through</text>
  <text x="840" y="545" font-size="12" fill="#cbd5e1" font-style="italic">the delivery stride. Front knee brace locked firm</text>
  <text x="840" y="565" font-size="12" fill="#cbd5e1" font-style="italic">at 152°, while bowling arm maintained 172°</text>
  <text x="840" y="585" font-size="12" fill="#cbd5e1" font-style="italic">legal extension with zero chucking risk."</text>
  <text x="840" y="608" font-size="10" font-family="monospace" fill="#10b981">✓ Tactile Haptic Alert Trigger: Clear (No Fault)</text>
</svg>

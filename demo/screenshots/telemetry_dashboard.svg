<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#030712; font-family:'Inter', sans-serif;">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="15" width="30" height="30" rx="6" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1.5"/>
  <text x="32" y="36" font-size="16">🏏</text>
  <text x="68" y="37" font-weight="800" font-size="18" fill="#ffffff" letter-spacing="1">KINECTRA <tspan fill="#f97316" font-size="11" font-family="monospace">HARDWARE LAB</tspan></text>
  
  <rect x="940" y="16" width="120" height="28" rx="6" fill="#f97316"/>
  <text x="960" y="34" font-size="11" font-weight="700" fill="#ffffff">BOWLING DELIVERY</text>
  <rect x="1075" y="16" width="95" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="1092" y="34" font-size="11" font-weight="600" fill="#94a3b8">BATTING</text>

  <!-- 4 Top Gauges -->
  <!-- Gauge 1 -->
  <rect x="30" y="80" width="265" height="90" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="50" y="105" font-size="12" fill="#94a3b8" font-weight="600">DELIVERY ELBOW ANGLE</text>
  <circle cx="270" cy="100" r="4" fill="#10b981"/>
  <text x="50" y="145" font-size="32" font-family="monospace" font-weight="800" fill="#ffffff">172°</text>
  <text x="135" y="142" font-size="11" fill="#10b981" font-weight="600">LEGAL (ICC &lt; 15°)</text>

  <!-- Gauge 2 -->
  <rect x="325" y="80" width="265" height="90" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="345" y="105" font-size="12" fill="#94a3b8" font-weight="600">FRONT KNEE BRACE</text>
  <circle cx="565" cy="100" r="4" fill="#10b981"/>
  <text x="345" y="145" font-size="32" font-family="monospace" font-weight="800" fill="#ffffff">152°</text>
  <text x="430" y="142" font-size="11" fill="#10b981" font-weight="600">FIRM LEVER LOCK</text>

  <!-- Gauge 3 -->
  <rect x="620" y="80" width="265" height="90" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="640" y="105" font-size="12" fill="#94a3b8" font-weight="600">LATERAL SPINE TILT</text>
  <circle cx="860" cy="100" r="4" fill="#38bdf8"/>
  <text x="640" y="145" font-size="32" font-family="monospace" font-weight="800" fill="#ffffff">22°</text>
  <text x="705" y="142" font-size="11" fill="#38bdf8" font-weight="600">OPTIMAL LOAD</text>

  <!-- Gauge 4 -->
  <rect x="915" y="80" width="255" height="90" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="935" y="105" font-size="12" fill="#94a3b8" font-weight="600">OVERALL TECHNIQUE</text>
  <text x="935" y="145" font-size="32" font-family="monospace" font-weight="800" fill="#38bdf8">94<tspan font-size="16" fill="#64748b">/100</tspan></text>
  <rect x="1040" y="130" width="110" height="8" rx="4" fill="#1e293b"/>
  <rect x="1040" y="130" width="103" height="8" rx="4" fill="#0ea5e9"/>

  <!-- Left Main Screen: Vision Skeletal Reticle -->
  <rect x="30" y="195" width="750" height="445" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Canvas Grid -->
  <path d="M 30 280 L 780 280 M 30 360 L 780 360 M 30 440 L 780 440 M 30 520 L 780 520" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4,4"/>
  <path d="M 180 195 L 180 640 M 330 195 L 330 640 M 480 195 L 480 640 M 630 195 L 630 640" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4,4"/>
  
  <!-- Skeleton Figure -->
  <circle cx="405" cy="270" r="22" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <!-- Spine -->
  <line x1="405" y1="292" x2="395" y2="410" stroke="#0ea5e9" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Shoulders -->
  <line x1="360" y1="315" x2="450" y2="315" stroke="#0ea5e9" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Bowling Arm (Overhead) -->
  <line x1="450" y1="315" x2="475" y2="245" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  <line x1="475" y1="245" x2="480" y2="185" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  <!-- Non-bowling arm -->
  <line x1="360" y1="315" x2="335" y2="380" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="395" y1="410" x2="445" y2="495" stroke="#0ea5e9" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="445" y1="495" x2="475" y2="585" stroke="#10b981" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="395" y1="410" x2="340" y2="490" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
  <line x1="340" y1="490" x2="315" y2="570" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>

  <!-- Joint Nodes -->
  <circle cx="450" cy="315" r="5" fill="#38bdf8"/>
  <circle cx="475" cy="245" r="5" fill="#38bdf8"/>
  <circle cx="480" cy="185" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <circle cx="445" cy="495" r="5" fill="#10b981"/>
  <circle cx="475" cy="585" r="5" fill="#38bdf8"/>

